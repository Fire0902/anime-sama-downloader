name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          # Defaut de l'action : 10m, insuffisant (le build front prend deja ~4min
          # et la session etait coupee pendant l'export de l'image).
          command_timeout: 30m
          script: |
            cd /home/dam/anime-sama-downloader
            git pull
            export INIT_USER=${{ secrets.SSH_USERNAME }}
            export INIT_PASS=${{ secrets.SSH_PASSWORD }}
            # Build d'abord : l'ancien container continue de servir pendant ce
            # temps. `up -d` ne recree le container qu'une fois la nouvelle image
            # prete, et un build qui echoue laisse la version en place.
            docker compose build
            docker compose up -d
