name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/dam/anime-sama-downloader
            git pull
            docker compose down
            docker compose up --build -d
            sleep 5
            docker compose exec -T -e INIT_USER=${{ secrets.SSH_USERNAME }} -e INIT_PASS=${{ secrets.SSH_PASSWORD }} anime-sama npx tsx /app/adapters/web/back/create-user.ts
