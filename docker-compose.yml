version: "3.9"

services:
  anime-sama:
    build:
      context: .
      args:
        - BACK_URL=${BACK_URL:-http://localhost:3000}
    container_name: anime-sama
    ports:
      - "3000:3000"
    volumes:
      - ./adapters/web/back/downloads:/app/adapters/web/back/downloads
      - ./adapters/web/back/sql:/app/adapters/web/back/sql
    environment:
      - INIT_USER
      - INIT_PASS
    restart: unless-stopped