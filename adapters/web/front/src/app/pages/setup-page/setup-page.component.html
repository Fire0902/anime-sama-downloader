<div class="min-h-screen w-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
        <svg class="w-9 h-9 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2 bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">
        AnimeDL
      </h1>
      <p class="text-slate-400 text-sm">Première utilisation — Créez votre compte admin</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-800/60 backdrop-blur-lg rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700/50">

      <div class="flex items-center gap-3 mb-6 p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl">
        <svg class="w-5 h-5 text-indigo-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-indigo-300 text-sm">Aucun utilisateur trouvé. Ce compte sera l'administrateur.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Nom d'utilisateur</label>
          <input type="text" [(ngModel)]="username" name="username" required autocomplete="username"
            class="w-full px-4 py-3 bg-slate-900/60 border-2 border-slate-600 rounded-xl
                   focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none
                   text-white placeholder-slate-500 transition-all"
            placeholder="ex: admin">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required autocomplete="email"
            class="w-full px-4 py-3 bg-slate-900/60 border-2 border-slate-600 rounded-xl
                   focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none
                   text-white placeholder-slate-500 transition-all"
            placeholder="ex: admin@example.com">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Mot de passe</label>
          <input type="password" [(ngModel)]="password" name="password" required autocomplete="new-password"
            class="w-full px-4 py-3 bg-slate-900/60 border-2 border-slate-600 rounded-xl
                   focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none
                   text-white placeholder-slate-500 transition-all"
            placeholder="Min. 6 caractères">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Confirmer le mot de passe</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password"
            class="w-full px-4 py-3 bg-slate-900/60 border-2 border-slate-600 rounded-xl
                   focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none
                   text-white placeholder-slate-500 transition-all"
            placeholder="Répétez le mot de passe">
        </div>

        <!-- Error -->
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/40 rounded-xl p-4 flex items-start gap-2">
          <svg class="w-4 h-4 text-red-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-red-400 text-sm">{{ errorMessage }}</p>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500
                 text-white font-semibold py-3 rounded-xl transition-all duration-200
                 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed
                 shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40">
          <svg *ngIf="isLoading" class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          {{ isLoading ? 'Création...' : 'Créer le compte admin' }}
        </button>

      </form>
    </div>

  </div>
</div>
