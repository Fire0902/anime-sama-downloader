<div class="p-6 max-w-4xl mx-auto">

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-white">Favoris</h1>
    <button (click)="showAddFavoriteModal = true"
      class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Ajouter un favori
    </button>
  </div>

  <div class="mb-4">
    <app-favorites-panel
      *ngIf="currentUser"
      [favorites]="favorites"
      [expanded]="favoritesExpanded"
      (onToggle)="favoritesExpanded = !favoritesExpanded"
      (onAddClick)="showAddFavoriteModal = true"
      (onCheckFavorite)="checkFavoriteNow($event)"
      (onSearchFromFavorite)="searchAnimeFromFavorite($event)"
      (onRemoveFavorite)="removeFavorite($event)">
    </app-favorites-panel>
  </div>

  <div class="mb-4">
    <app-scheduled-downloads-panel
      *ngIf="currentUser && scheduledDownloads.length > 0"
      [scheduledDownloads]="scheduledDownloads"
      [expanded]="scheduledExpanded"
      (onToggle)="scheduledExpanded = !scheduledExpanded">
    </app-scheduled-downloads-panel>
  </div>

  <app-add-favorite-modal
    *ngIf="showAddFavoriteModal"
    [form]="addFavoriteForm"
    [malResults]="malResults"
    [malSearchQuery]="malSearchQuery"
    (onSubmit)="addFavorite()"
    (onClose)="showAddFavoriteModal = false"
    (onSearchMAL)="searchMAL()"
    (onSelectMAL)="selectMALResult($event)"
    (onMalQueryChange)="malSearchQuery = $event">
  </app-add-favorite-modal>

</div>
