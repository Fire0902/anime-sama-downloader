<app-accordion-section title="Espace disque" badge="Storage" [expanded]="expanded" (onToggle)="onToggle.emit()">
  <ng-container slot="icon">
    <svg class="w-6 h-6 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </ng-container>

  <div *ngIf="isLoading" class="flex justify-center py-8">
    <div class="text-slate-400">Chargement...</div>
  </div>

  <div *ngIf="!isLoading && storageInfo" class="space-y-4">
    <!-- Download Folder Size Card -->
    <div class="bg-gradient-to-br from-blue-900/30 to-blue-800/30 border border-blue-600/50 rounded-lg p-6">
      <p class="text-sm text-blue-300 mb-3 font-medium">Espace utilisé</p>
      <p class="text-4xl font-bold text-blue-400 mb-2">{{ storageInfo.downloadPathSizeFormatted }}</p>
      <p class="text-xs text-slate-400 break-all">{{ storageInfo.downloadPath }}</p>
      <p class="text-xs text-blue-300 mt-3">{{ (storageInfo.percentDownloadOfDisk).toFixed(2) }}% de l'espace total</p>
    </div>

    <!-- Refresh button -->
    <button (click)="loadStorageInfo()"
      class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-all flex items-center gap-2 w-full justify-center text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Actualiser
    </button>
  </div>
</app-accordion-section>
