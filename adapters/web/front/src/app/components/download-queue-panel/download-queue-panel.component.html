<div class="bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl border border-slate-700/50 overflow-hidden">

  <!-- Header toggle -->
  <button (click)="onToggle.emit()"
    class="w-full px-8 py-4 flex items-center justify-between hover:bg-slate-700/30 transition-all">
    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h2 class="text-xl font-bold text-white">File d'attente</h2>
      <span class="text-xs text-slate-400 bg-slate-700/50 px-2 py-1 rounded-full">
        {{ queue.length }} en attente
      </span>
    </div>
    <svg class="w-5 h-5 text-slate-400 transition-transform"
      [class.rotate-180]="expanded"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Queue list -->
  <div *ngIf="expanded" class="p-8 border-t border-slate-700/50">
    <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
      <div *ngFor="let download of queue; let i = index"
        class="bg-gradient-to-r from-slate-700/30 to-slate-800/30 border border-slate-600/50 rounded-xl p-4
          flex items-center justify-between group hover:border-slate-500 transition-all">
        <div class="flex items-center gap-4">
          <span class="text-slate-400 font-mono text-sm bg-slate-900/50 px-2 py-1 rounded">
            #{{ i + 1 }}
          </span>
          <div>
            <h3 class="text-white font-medium text-sm">{{ download.name }}</h3>
            <p class="text-slate-500 text-xs mt-0.5">En attente...</p>
          </div>
        </div>
        <button (click)="onRemove.emit(download)"
          class="text-red-400 hover:text-red-300 opacity-0 group-hover:opacity-100 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
