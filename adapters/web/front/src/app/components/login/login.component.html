<div class="min-h-screen w-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-5xl font-bold text-white mb-2 bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">
        Anime Sama
      </h1>
      <p class="text-slate-400">{{ isLoginMode ? 'Connexion' : 'Inscription' }}</p>
    </div>

    <div class="bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-slate-700/50">
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-2">
            Nom d'utilisateur
          </label>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            required
            class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 rounded-xl 
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none 
                   text-white placeholder-slate-400 transition-all duration-300"
            placeholder="Entrez votre nom d'utilisateur"
          />
        </div>

        <div *ngIf="!isLoginMode">
          <label for="email" class="block text-sm font-medium text-slate-300 mb-2">
            Email
          </label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 rounded-xl 
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none 
                   text-white placeholder-slate-400 transition-all duration-300"
            placeholder="Entrez votre email"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
            Mot de passe
          </label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 rounded-xl 
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none 
                   text-white placeholder-slate-400 transition-all duration-300"
            placeholder="Entrez votre mot de passe"
          />
        </div>

        <div *ngIf="!isLoginMode">
          <label for="confirmPassword" class="block text-sm font-medium text-slate-300 mb-2">
            Confirmer le mot de passe
          </label>
          <input
            type="password"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 rounded-xl 
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none 
                   text-white placeholder-slate-400 transition-all duration-300"
            placeholder="Confirmez votre mot de passe"
          />
        </div>

        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 rounded-xl p-4">
          <p class="text-red-400 text-sm flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            {{ errorMessage }}
          </p>
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700
                 text-white font-bold py-4 rounded-xl transition-all duration-300 
                 transform hover:scale-[1.02] hover:shadow-xl hover:shadow-blue-500/30
                 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100
                 flex items-center justify-center gap-3"
        >
          <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" 
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <span>{{ isLoading ? 'Chargement...' : (isLoginMode ? 'Se connecter' : 'S\'inscrire') }}</span>
        </button>
      </form>

      

    <div class="mt-8 text-center text-slate-500 text-sm">
      <p>Anime Sama Downloader v2.0</p>
    </div>
  </div>
</div>
