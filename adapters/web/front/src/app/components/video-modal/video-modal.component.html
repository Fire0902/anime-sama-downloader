<div class="fixed inset-0 bg-black/95 backdrop-blur-sm flex flex-col z-50">

  <!-- Top bar -->
  <div class="flex items-center justify-between px-4 py-3 bg-slate-900/80 border-b border-slate-700/50 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <button (click)="onClose.emit()"
        class="p-2 rounded-lg hover:bg-slate-700 transition-all text-slate-400 hover:text-white shrink-0"
        title="Fermer (Échap)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <div class="min-w-0">
        <p class="text-xs text-slate-400 truncate">{{ currentEpisode?.anime_name }}<span *ngIf="currentEpisode?.season_name"> · {{ currentEpisode?.season_name }}</span></p>
        <h3 class="text-white font-semibold text-sm truncate">{{ currentEpisode?.episode_name }}</h3>
      </div>
    </div>

    <div class="flex items-center gap-1 sm:gap-2 shrink-0">
      <button (click)="prev()" [disabled]="!hasPrev"
        class="p-2 rounded-lg transition-all text-slate-400 hover:text-white hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"
        title="Épisode précédent (P)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="text-slate-400 text-xs hidden sm:block px-1">{{ currentIndex + 1 }} / {{ playlist.length }}</span>
      <button (click)="next()" [disabled]="!hasNext"
        class="p-2 rounded-lg transition-all text-slate-400 hover:text-white hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"
        title="Épisode suivant (N)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
      <button *ngIf="playlist.length > 1" (click)="toggleSidebar()"
        class="p-2 rounded-lg transition-all text-slate-400 hover:text-white hover:bg-slate-700"
        title="Liste des épisodes">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main: video + sidebar -->
  <div class="flex flex-1 min-h-0">

    <!-- Video -->
    <div class="flex-1 flex items-center justify-center bg-black min-w-0">
      <video #videoRef
        *ngIf="currentEpisode"
        class="w-full h-full max-h-full object-contain"
        controls
        autoplay
        (ended)="onVideoEnded()"
        [src]="videoUrl(currentEpisode)">
        Votre navigateur ne supporte pas la lecture vidéo.
      </video>
    </div>

    <!-- Episode sidebar -->
    <div *ngIf="sidebarOpen && playlist.length > 1"
      class="w-56 sm:w-72 bg-slate-900 border-l border-slate-700/50 flex flex-col shrink-0 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-700/50 shrink-0">
        <p class="text-slate-400 text-xs uppercase tracking-wider font-medium">Épisodes</p>
      </div>
      <div class="flex-1 overflow-y-auto">
        <button *ngFor="let ep of playlist; let i = index"
          (click)="goTo(i)"
          class="w-full px-4 py-3 text-left flex items-center gap-3 border-b border-slate-800/50 transition-all"
          [class.bg-indigo-600/20]="i === currentIndex"
          [class.border-indigo-500/20]="i === currentIndex"
          [class.hover:bg-slate-700/40]="i !== currentIndex">

          <div class="shrink-0 w-6 h-6 flex items-center justify-center">
            <svg *ngIf="i === currentIndex" class="w-4 h-4 text-indigo-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span *ngIf="i !== currentIndex" class="text-xs text-slate-500">{{ i + 1 }}</span>
          </div>

          <span class="text-sm truncate"
            [class.text-white]="i === currentIndex"
            [class.font-medium]="i === currentIndex"
            [class.text-slate-400]="i !== currentIndex">
            {{ ep.episode_name }}
          </span>
        </button>
      </div>
    </div>

  </div>

  <!-- Keyboard hints (desktop only) -->
  <div class="hidden sm:flex px-4 py-2 bg-slate-900/60 border-t border-slate-700/30 items-center gap-4 text-xs text-slate-500 shrink-0">
    <span><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-slate-300">Espace</kbd> Pause</span>
    <span><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-slate-300">← →</kbd> ±10s</span>
    <span><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-slate-300">↑ ↓</kbd> Volume</span>
    <span><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-slate-300">F</kbd> Plein écran</span>
    <span><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-slate-300">N / P</kbd> Suivant / Précédent</span>
  </div>

</div>
