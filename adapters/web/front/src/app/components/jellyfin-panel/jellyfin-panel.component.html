<app-accordion-section
  title="Bibliothèque Jellyfin"
  [badge]="isLoading ? '…' : (totalResults + ' série(s)')"
  [expanded]="expanded"
  (onToggle)="onToggle.emit()">

  <ng-container slot="icon">
    <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5 3l14 9-14 9V3z"/>
    </svg>
  </ng-container>

  <!-- Loading -->
  <div *ngIf="isLoading" class="flex items-center justify-center py-10 text-slate-400">
    <svg class="w-6 h-6 animate-spin mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Chargement…
  </div>

  <!-- Error -->
  <div *ngIf="!isLoading && error"
    class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 text-sm text-red-300 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ error }}
    </div>
    <a href="https://anime-sama.fr" target="_blank" rel="noopener"
      class="shrink-0 text-xs px-2 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 transition-colors flex items-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      Anime-Sama
    </a>
  </div>

  <!-- Empty -->
  <div *ngIf="!isLoading && !error && totalResults === 0"
    class="text-center text-slate-400 py-10 text-sm">
    Aucune série trouvée dans la bibliothèque
  </div>

  <!-- List -->
  <div *ngIf="!isLoading && !error && totalResults > 0" class="space-y-3">
    <div *ngFor="let s of series"
      class="group bg-slate-900/50 border border-slate-700/50 rounded-xl overflow-hidden flex hover:border-cyan-500/40 transition-colors">

      <!-- Poster -->
      <div class="w-16 shrink-0 flex items-center justify-center p-2">
        <img *ngIf="s.posterUrl" [src]="s.posterUrl" [alt]="s.name"
          class="w-full rounded-lg object-cover shadow-md" />
        <svg *ngIf="!s.posterUrl" class="w-7 h-7 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M14 8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>

      <!-- Content -->
      <div class="flex-1 p-3 flex items-start gap-3 min-w-0">

        <!-- Info -->
        <div class="flex-1 min-w-0">
          <p class="text-white font-medium truncate">{{ s.name }}</p>
          <p *ngIf="s.year" class="text-xs text-slate-500 mt-0.5">{{ s.year }}</p>

          <!-- Missing episodes -->
          <div class="mt-1.5">
            <span *ngIf="s.missingEpisodes.length === 0"
              class="text-xs px-2 py-0.5 rounded-full bg-green-500/15 text-green-400 font-medium">
              ✓ Complet
            </span>
            <div *ngIf="s.missingEpisodes.length > 0" class="flex flex-wrap gap-1 mt-0.5">
              <span *ngFor="let m of s.missingEpisodes"
                class="text-xs px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 font-medium">
                S{{ m.season }}&nbsp;: ép.&nbsp;{{ m.episodes.join(', ') }}
              </span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="shrink-0 flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
          <button (click)="searchTitle(s)"
            title="Rechercher cet anime"
            class="text-xs px-2 py-1 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/40 text-cyan-300 transition-colors flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            Chercher
          </button>
          <button *ngIf="s.missingEpisodes.length > 0" (click)="selectMissing(s)"
            title="Cocher automatiquement les épisodes manquants"
            class="text-xs px-2 py-1 rounded-lg bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 transition-colors flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Sélectionner
          </button>
        </div>

      </div>
    </div>

    <!-- Pagination -->
    <div *ngIf="totalPages > 1" class="flex items-center justify-between pt-2">
      <button (click)="prevPage()" [disabled]="currentPage === 0"
        class="px-3 py-1.5 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-sm transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Précédent
      </button>
      <span class="text-xs text-slate-400">{{ currentPage + 1 }} / {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="currentPage === totalPages - 1"
        class="px-3 py-1.5 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-sm transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1">
        Suivant
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- Refresh -->
    <button (click)="load(0)"
      class="w-full mt-1 px-4 py-2 bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 rounded-lg transition-colors text-sm font-medium flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Actualiser
    </button>
  </div>

</app-accordion-section>
