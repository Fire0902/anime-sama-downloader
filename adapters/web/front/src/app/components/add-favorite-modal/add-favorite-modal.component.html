<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-slate-800 rounded-2xl p-8 max-w-md w-full mx-4 border border-slate-700 shadow-2xl">
    <h2 class="text-2xl font-bold text-white mb-6">Ajouter un favori</h2>

    <div class="space-y-4">

      <!-- Anime name -->
      <div>
        <label class="block text-slate-300 mb-2">Nom de l'anime</label>
        <input [(ngModel)]="form.animeName" name="animeName" type="text" required
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white
            focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition-all" />
      </div>

      <!-- Anime URL -->
      <div>
        <label class="block text-slate-300 mb-2">URL de l'anime</label>
        <input [(ngModel)]="form.animeUrl" name="animeUrl" type="text" required
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white
            focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition-all" />
      </div>

      <!-- MAL search -->
      <div>
        <label class="block text-slate-300 mb-2">MAL ID (optionnel)</label>
        <div class="flex gap-2">
          <input
            [ngModel]="malSearchQuery"
            (ngModelChange)="onMalQueryChange.emit($event)"
            name="malSearch"
            type="text"
            placeholder="Rechercher sur MAL..."
            class="flex-1 px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white
              focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition-all" />
          <button type="button" (click)="onSearchMAL.emit()"
            class="px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-all">
            Chercher
          </button>
        </div>

        <!-- MAL results -->
        <div *ngIf="malResults.length > 0" class="mt-2 max-h-40 overflow-y-auto space-y-1">
          <div *ngFor="let result of malResults" (click)="onSelectMAL.emit(result)"
            class="p-2 bg-slate-700/50 hover:bg-slate-700 rounded cursor-pointer text-sm text-white">
            {{ result.title }} (ID: {{ result.id }})
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-4">
        <button type="button" (click)="onSubmit.emit()"
          class="flex-1 px-4 py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-lg transition-all">
          Ajouter
        </button>
        <button type="button" (click)="onClose.emit()"
          class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-all">
          Annuler
        </button>
      </div>

    </div>
  </div>
</div>
