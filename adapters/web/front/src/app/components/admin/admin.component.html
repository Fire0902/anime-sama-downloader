<div class="min-h-screen w-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6">
  <div class="w-full max-w-6xl mx-auto">
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">
        Administration
      </h1>
      <p class="text-slate-400">Gestion des utilisateurs</p>
    </div>

    <div *ngIf="successMessage" class="mb-6 bg-green-500/10 border border-green-500/50 rounded-xl p-4">
      <p class="text-green-400 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        {{ successMessage }}
      </p>
    </div>

    <div *ngIf="errorMessage" class="mb-6 bg-red-500/10 border border-red-500/50 rounded-xl p-4">
      <p class="text-red-400 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ errorMessage }}
      </p>
    </div>

    <div class="mb-6">
      <button
        (click)="toggleCreateForm()"
        class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700
               text-white font-semibold px-6 py-3 rounded-xl transition-all duration-300
               transform hover:scale-105 hover:shadow-lg hover:shadow-blue-500/30 flex items-center gap-2"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        {{ showCreateForm ? 'Annuler' : 'Créer un utilisateur' }}
      </button>
    </div>

    <div *ngIf="showCreateForm" class="mb-6 bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-slate-700/50">
      <h2 class="text-xl font-bold text-white mb-4">Nouvel utilisateur</h2>
      
      <form (ngSubmit)="createUser()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">
              Nom d'utilisateur
            </label>
            <input
              type="text"
              [(ngModel)]="newUser.username"
              name="username"
              required
              class="w-full px-4 py-2 bg-slate-900/50 border-2 border-slate-600 rounded-xl
                     focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none
                     text-white placeholder-slate-400 transition-all"
              placeholder="johndoe"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">
              Email
            </label>
            <input
              type="email"
              [(ngModel)]="newUser.email"
              name="email"
              required
              class="w-full px-4 py-2 bg-slate-900/50 border-2 border-slate-600 rounded-xl
                     focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none
                     text-white placeholder-slate-400 transition-all"
              placeholder="john@example.com"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Mot de passe
          </label>
          <input
            type="password"
            [(ngModel)]="newUser.password"
            name="password"
            required
            class="w-full px-4 py-2 bg-slate-900/50 border-2 border-slate-600 rounded-xl
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none
                   text-white placeholder-slate-400 transition-all"
            placeholder="Minimum 6 caractères"
          />
        </div>

        <div class="flex items-center gap-3">
          <input
            type="checkbox"
            id="isAdmin"
            [(ngModel)]="newUser.isAdmin"
            name="isAdmin"
            class="w-5 h-5 rounded border-slate-600 bg-slate-900/50 text-blue-500
                   focus:ring-4 focus:ring-blue-500/20"
          />
          <label for="isAdmin" class="text-sm font-medium text-slate-300">
            Administrateur
          </label>
        </div>

        <div class="flex gap-3">
          <button
            type="submit"
            [disabled]="isLoading"
            class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700
                   text-white font-semibold px-6 py-2 rounded-xl transition-all
                   disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            Créer
          </button>

          <button
            type="button"
            (click)="toggleCreateForm()"
            class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-6 py-2 rounded-xl transition-all"
          >
            Annuler
          </button>
        </div>
      </form>
    </div>

    <div class="bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-slate-700/50">
      <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
        <svg class="w-7 h-7 mr-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        Utilisateurs ({{ users.length }})
      </h2>

      <div *ngIf="isLoading" class="text-center py-8">
        <div class="inline-block animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div>
        <p class="text-slate-400 mt-3">Chargement...</p>
      </div>

      <div *ngIf="!isLoading && users.length === 0" class="text-center py-8">
        <p class="text-slate-400">Aucun utilisateur</p>
      </div>

      <div *ngIf="!isLoading && users.length > 0" class="space-y-3">
        <div *ngFor="let user of users"
             class="bg-gradient-to-r from-slate-700/30 to-slate-800/30 border border-slate-600/50 rounded-xl p-5
                    hover:border-slate-500 transition-all">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h3 class="text-white font-semibold text-lg">{{ user.username }}</h3>
                <span *ngIf="user.is_admin"
                      class="text-xs font-semibold text-purple-400 bg-purple-500/20 px-2 py-1 rounded">
                  Admin
                </span>
                <span *ngIf="user.id === authService.getCurrentUser()?.id"
                      class="text-xs font-semibold text-blue-400 bg-blue-500/20 px-2 py-1 rounded">
                  Vous
                </span>
              </div>
              <p class="text-slate-400 text-sm mb-1">{{ user.email }}</p>
              <p class="text-slate-500 text-xs">
                Créé le {{ formatDate(user.created_at) }}
              </p>
            </div>

            <button
              *ngIf="user.id !== authService.getCurrentUser()?.id"
              (click)="deleteUser(user)"
              class="text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all p-2 rounded-lg"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
