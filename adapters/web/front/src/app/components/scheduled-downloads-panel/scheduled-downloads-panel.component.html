<app-accordion-section title="Mes Téléchargements Programmés"
  [badge]="(scheduledDownloads?.length || 0) + ' programmés'"
  [expanded]="expanded" (onToggle)="onToggle.emit()">
  <ng-container slot="icon">
    <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </ng-container>

  <div class="space-y-3">
    <div *ngFor="let s of scheduledDownloads"
      class="bg-gradient-to-r from-indigo-600/10 to-purple-600/10 border border-indigo-500/30 rounded-xl p-5">
      <div class="flex items-center justify-between">
        <div class="flex-1">
          <h3 class="text-white font-medium text-lg mb-1">{{ s.animeName }}</h3>
          <p class="text-slate-400 text-sm mb-2">Épisode {{ s.episodeNumber }}</p>
          <div class="flex items-center gap-3 text-xs text-slate-400">
            <span>{{ s.scheduledTime | date:'dd/MM/yyyy HH:mm' }}</span>
            <span class="text-indigo-400 bg-indigo-500/10 px-2 py-1 rounded">
              Dans {{ s.timeRemaining | timeRemaining }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-accordion-section>
