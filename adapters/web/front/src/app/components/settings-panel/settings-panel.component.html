<app-accordion-section
  title="Paramètres"
  [expanded]="expanded"
  (onToggle)="onToggle.emit()">

  <ng-container slot="icon">
    <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
  </ng-container>

  <div class="bg-slate-900/50 border border-slate-600/30 rounded-xl p-6">
    <h3 class="text-sm font-semibold text-white mb-6">Téléchargements simultanés</h3>

    <div class="flex items-center gap-6">
      <input
        type="range"
        min="1"
        max="10"
        [(ngModel)]="maxConcurrent"
        (ngModelChange)="onChange()"
        class="flex-1 h-2 rounded-lg appearance-none cursor-pointer accent-cyan-500 bg-slate-700">

      <span class="shrink-0 w-8 text-center text-2xl font-bold text-cyan-400">
        {{ maxConcurrent }}
      </span>
    </div>

    <div class="flex justify-between text-xs text-slate-500 mt-2 px-0.5">
      <span>1</span>
      <span>5</span>
      <span>10</span>
    </div>

    <p class="text-xs text-slate-400 mt-4">
      Nombre maximum de téléchargements traités en parallèle. Les suivants attendent dans la file.
    </p>
  </div>

</app-accordion-section>
