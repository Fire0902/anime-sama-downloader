<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-slate-800 rounded-2xl p-8 max-w-md w-full mx-4 border border-slate-700 shadow-2xl">
    <h2 class="text-2xl font-bold text-white mb-6">Créer un utilisateur</h2>
    <form (submit)="onSubmit.emit(); $event.preventDefault()" class="space-y-4">
      <div>
        <label class="block text-slate-300 mb-2">Nom d'utilisateur</label>
        <input [(ngModel)]="form.username" name="username" type="text" required
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:border-green-500 focus:ring-2 focus:ring-green-500/20 outline-none transition-all" />
      </div>
      <div>
        <label class="block text-slate-300 mb-2">Email</label>
        <input [(ngModel)]="form.email" name="email" type="email" required
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:border-green-500 focus:ring-2 focus:ring-green-500/20 outline-none transition-all" />
      </div>
      <div>
        <label class="block text-slate-300 mb-2">Mot de passe</label>
        <input [(ngModel)]="form.password" name="password" type="password" required
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:border-green-500 focus:ring-2 focus:ring-green-500/20 outline-none transition-all" />
      </div>
      <div class="flex items-center gap-3">
        <input [(ngModel)]="form.is_admin" name="is_admin" type="checkbox" id="is_admin"
          class="w-5 h-5 bg-slate-900/50 border border-slate-600 rounded focus:ring-2 focus:ring-green-500/20 text-green-600" />
        <label for="is_admin" class="text-slate-300 cursor-pointer">Administrateur</label>
      </div>
      <div class="flex gap-3 pt-4">
        <button type="submit"
          class="flex-1 px-4 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition-all">
          Créer
        </button>
        <button type="button" (click)="onClose.emit()"
          class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-all">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
