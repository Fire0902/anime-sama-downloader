<div class="bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-slate-700/50">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-white flex items-center">
      <svg class="w-8 h-8 mr-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Épisodes disponibles
    </h2>
    <div class="flex items-center gap-3">
      <span class="text-sm text-slate-400 bg-slate-700/50 px-3 py-1 rounded-full">
        {{ getSelectedEpisodes().length }} / {{ episodes.length }} sélectionnés
      </span>
      <button (click)="onToggleAll.emit()"
        class="text-sm text-blue-400 hover:text-blue-300 transition-colors font-medium">
        {{ areAllEpisodesSelected() ? 'Tout désélectionner' : 'Tout sélectionner' }}
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-8">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-500"></div>
    <p class="text-slate-400 mt-3">Chargement des épisodes...</p>
  </div>

  <!-- Episode list -->
  <div *ngIf="!isLoading" class="space-y-3">
    <div class="max-h-96 overflow-y-auto pr-2 p-2 space-y-2">
      <div *ngFor="let episode of episodes; let i = index"
        (click)="onToggleEpisode.emit(episode)"
        [class.bg-gradient-to-r]="episode.selected"
        [class.from-emerald-600\/20]="episode.selected"
        [class.to-teal-600\/20]="episode.selected"
        [class.border-emerald-500]="episode.selected"
        [class.from-slate-700\/30]="!episode.selected"
        [class.to-slate-800\/30]="!episode.selected"
        [class.border-slate-600\/50]="!episode.selected"
        class="border-2 rounded-xl p-4 cursor-pointer transition-all duration-300 transform hover:scale-[1.01]
          hover:shadow-lg group flex items-center gap-4">

        <!-- Checkbox -->
        <div class="flex-shrink-0">
          <div [class.bg-emerald-500]="episode.selected"
            [class.border-emerald-500]="episode.selected"
            [class.bg-slate-700]="!episode.selected"
            [class.border-slate-500]="!episode.selected"
            class="w-6 h-6 border-2 rounded-md flex items-center justify-center transition-all">
            <svg *ngIf="episode.selected" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        </div>

        <!-- Episode number badge -->
        <div class="flex-shrink-0">
          <span [class.text-emerald-400]="episode.selected" [class.text-slate-400]="!episode.selected"
            class="text-xs font-semibold bg-slate-900/50 px-3 py-1.5 rounded-lg">
            Ep {{ i + 1 }}
          </span>
        </div>

        <!-- Episode name -->
        <div class="flex-1">
          <span [class.text-white]="episode.selected" [class.text-slate-300]="!episode.selected"
            class="font-medium text-sm truncate block group-hover:text-emerald-300 transition-colors">
            {{ episode.name }}
          </span>
        </div>

        <!-- Play icon -->
        <svg [class.text-emerald-400]="episode.selected" [class.text-slate-500]="!episode.selected"
          class="w-5 h-5 transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <!-- Validate button -->
    <div class="pt-4 border-t border-slate-600/50">
      <button (click)="onValidate.emit()"
        [disabled]="getSelectedEpisodes().length === 0 || !currentUser"
        [class.opacity-50]="getSelectedEpisodes().length === 0 || !currentUser"
        [class.cursor-not-allowed]="getSelectedEpisodes().length === 0 || !currentUser"
        class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700
          text-white font-bold py-4 rounded-xl transition-all duration-300
          transform hover:scale-[1.02] hover:shadow-xl hover:shadow-emerald-500/30
          flex items-center justify-center gap-3 disabled:hover:scale-100 disabled:hover:shadow-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        {{ !currentUser ? 'Connectez-vous pour télécharger' : 'Valider les téléchargements (' + getSelectedEpisodes().length + ')' }}
      </button>
    </div>
  </div>

</div>
