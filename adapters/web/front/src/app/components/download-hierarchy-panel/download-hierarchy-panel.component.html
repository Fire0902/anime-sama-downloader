<div class="bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl border border-slate-700/50 overflow-hidden">
  <button (click)="onToggle.emit()"
    class="w-full px-8 py-4 flex items-center justify-between hover:bg-slate-700/30 transition-all">
    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
      </svg>
      <h2 class="text-xl font-bold text-white">Mes Téléchargements</h2>
      <span class="text-xs text-slate-400 bg-slate-700/50 px-2 py-1 rounded-full">
        {{ getTotalDownloadsCount() }} Anime
      </span>
    </div>
    <svg class="w-5 h-5 text-slate-400 transition-transform"
      [class.rotate-180]="expanded"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div *ngIf="expanded" class="p-8 border-t border-slate-700/50">
    <div class="space-y-3">

      <!-- Empty state -->
      <div *ngIf="!hierarchy || hierarchy.length === 0" class="text-center py-12">
        <svg class="w-20 h-20 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
        <p class="text-slate-400 text-lg">Aucun téléchargement pour le moment</p>
      </div>

      <!-- Anime list -->
      <div *ngFor="let anime of hierarchy" class="border border-slate-600/50 rounded-xl overflow-hidden">

        <!-- Anime header -->
        <button (click)="onToggleAnime.emit(anime.anime_name)"
          class="w-full px-6 py-4 flex items-center justify-between bg-gradient-to-r from-purple-600/20 to-indigo-600/20
            hover:from-purple-600/30 hover:to-indigo-600/30 transition-all">
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
            </svg>
            <h3 class="text-white font-semibold">{{ anime.anime_name }}</h3>
            <span class="text-xs text-slate-400 bg-slate-700/50 px-2 py-1 rounded-full">
              {{ getTotalEpisodesForAnime(anime) }} épisodes
            </span>
          </div>
          <div class="flex items-center gap-3">
            <button (click)="onZipAnime.emit(anime.anime_name); $event.stopPropagation()"
              class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition-all flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              ZIP Anime
            </button>
            <svg class="w-5 h-5 text-slate-400 transition-transform"
              [class.rotate-180]="expandedAnimes[anime.anime_name]"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </button>

        <!-- Seasons -->
        <div *ngIf="expandedAnimes[anime.anime_name]" class="bg-slate-900/30">
          <div *ngFor="let season of anime.seasons" class="border-t border-slate-600/30">

            <!-- Season header -->
            <button (click)="onToggleSeason.emit({ anime: anime.anime_name, season: season.season_name })"
              class="w-full px-8 py-3 flex items-center justify-between hover:bg-slate-700/20 transition-all">
              <div class="flex items-center gap-3">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
                <span class="text-white font-medium">{{ season.season_name }}</span>
                <span class="text-xs text-slate-400 bg-slate-700/50 px-2 py-1 rounded-full">
                  {{ season.episodes.length }} épisodes
                </span>
              </div>
              <div class="flex items-center gap-3">
                <button (click)="onZipSeason.emit({ anime: anime.anime_name, season: season.season_name }); $event.stopPropagation()"
                  class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg transition-all flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                  ZIP Saison
                </button>
                <svg class="w-4 h-4 text-slate-400 transition-transform"
                  [class.rotate-180]="expandedSeasons[anime.anime_name + '/' + season.season_name]"
                  fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </button>

            <!-- Episodes -->
            <div *ngIf="expandedSeasons[anime.anime_name + '/' + season.season_name]" class="bg-slate-900/50">
              <div *ngFor="let episode of season.episodes"
                class="px-10 py-3 border-t border-slate-600/20 flex items-center justify-between hover:bg-slate-700/10 transition-all">
                <div class="flex items-center gap-3 flex-1">
                  <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span class="text-slate-300 text-sm">{{ episode.episode_name }}</span>
                  <span class="text-xs text-slate-500">{{ formatFileSize(episode.file_size) }}</span>
                </div>
                <div class="flex items-center gap-2">
                  <button (click)="onPlay.emit(episode)"
                    class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white text-sm rounded-lg transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Play
                  </button>
                  <button (click)="onDownload.emit(episode)"
                    class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    DL
                  </button>
                  <button (click)="onDelete.emit(episode.id)"
                    class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
