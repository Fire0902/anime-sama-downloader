<div class="bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-slate-700/50">
  <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
    <svg class="w-8 h-8 mr-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
    </svg>
    Saisons disponibles
  </h2>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-8">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div>
    <p class="text-slate-400 mt-3">Chargement des saisons...</p>
  </div>

  <!-- Grid -->
  <div *ngIf="!isLoading"
    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 max-h-96 overflow-y-auto pr-2 p-2">
    <div *ngFor="let season of seasons" (click)="onSelect.emit(season)"
      class="bg-gradient-to-br from-purple-600/20 to-blue-600/20 hover:from-purple-600/40 hover:to-blue-600/40
        border-2 border-purple-500/30 hover:border-purple-400 rounded-xl p-4 cursor-pointer
        transition-all duration-300 transform hover:scale-105 hover:shadow-xl
        hover:shadow-purple-500/30 group text-center">
      <div class="flex flex-col items-center justify-center h-full">
        <svg class="w-8 h-8 text-purple-400 group-hover:text-purple-300 mb-2 transition-colors"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-white font-medium text-sm group-hover:text-purple-200 transition-colors break-words">
          {{ season.name }}
        </span>
      </div>
    </div>
  </div>
</div>
