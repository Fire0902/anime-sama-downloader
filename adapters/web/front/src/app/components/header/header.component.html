<div class="mb-6 bg-slate-800/50 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-slate-700/50">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold text-white bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">
        Anime Sama Downloader
      </h1>
      <span *ngIf="currentUser" class="text-sm text-slate-400 bg-slate-700/50 px-3 py-1 rounded-full">
        👤 {{ currentUser.username }}
        <span *ngIf="currentUser.is_admin" class="ml-2 text-yellow-400">⭐ Admin</span>
      </span>
    </div>
    <button *ngIf="currentUser" (click)="onLogout.emit()"
      class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-all">
      Déconnexion
    </button>
  </div>
</div>
