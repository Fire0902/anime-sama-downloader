<aside
  class="flex flex-col bg-slate-900 border-r border-slate-700/50 transition-all duration-200 shrink-0 h-full"
  [class.w-64]="!collapsed"
  [class.w-16]="collapsed">

  <!-- Logo + toggle -->
  <div class="flex items-center h-16 px-4 border-b border-slate-700/50"
    [class.justify-between]="!collapsed"
    [class.justify-center]="collapsed">
    <div *ngIf="!collapsed" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
      </div>
      <span class="text-white font-semibold text-sm">AnimeDL</span>
    </div>
    <button (click)="toggleCollapse.emit()"
      class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- Nav links -->
  <nav class="flex-1 py-4 space-y-1 px-2 overflow-y-auto">

    <!-- Recherche -->
    <a routerLink="/search" routerLinkActive="bg-indigo-600/20 text-indigo-400 border-indigo-500/30"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/40 transition-colors border border-transparent group"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Recherche' : ''">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Recherche</span>
    </a>

    <!-- Téléchargements -->
    <a routerLink="/downloads" routerLinkActive="bg-indigo-600/20 text-indigo-400 border-indigo-500/30"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/40 transition-colors border border-transparent group"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Téléchargements' : ''">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Téléchargements</span>
    </a>

    <!-- Favoris -->
    <a routerLink="/favorites" routerLinkActive="bg-indigo-600/20 text-indigo-400 border-indigo-500/30"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/40 transition-colors border border-transparent group"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Favoris' : ''">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Favoris</span>
    </a>

    <!-- Paramètres -->
    <a routerLink="/settings" routerLinkActive="bg-indigo-600/20 text-indigo-400 border-indigo-500/30"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/40 transition-colors border border-transparent group"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Paramètres' : ''">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Paramètres</span>
    </a>

    <!-- Admin (admin only) -->
    <a *ngIf="isAdmin" routerLink="/admin" routerLinkActive="bg-indigo-600/20 text-indigo-400 border-indigo-500/30"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/40 transition-colors border border-transparent group"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Admin' : ''">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Admin</span>
    </a>
  </nav>

  <!-- User info + logout -->
  <div class="border-t border-slate-700/50 p-3"
    [class.text-center]="collapsed">
    <div *ngIf="!collapsed" class="flex items-center gap-3 mb-2 px-1">
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0">
        {{ user?.username?.charAt(0)?.toUpperCase() || '?' }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-white text-sm font-medium truncate">{{ user?.username }}</p>
        <p class="text-slate-500 text-xs truncate">{{ user?.is_admin ? 'Admin' : 'Utilisateur' }}</p>
      </div>
    </div>
    <div *ngIf="collapsed" class="flex justify-center mb-2">
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold">
        {{ user?.username?.charAt(0)?.toUpperCase() || '?' }}
      </div>
    </div>
    <button (click)="logout.emit()"
      class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition-colors text-sm"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Déconnexion' : ''">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span *ngIf="!collapsed">Déconnexion</span>
    </button>
  </div>
</aside>
